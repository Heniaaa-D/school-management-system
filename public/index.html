<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School MS — Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", "Segoe UI", sans-serif;
      }
      .display {
        font-family: "Poppins", "Segoe UI", sans-serif;
      }
      .shake {
        animation: shake 0.35s ease;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-6px);
        }
        75% {
          transform: translateX(6px);
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="display text-2xl font-bold text-gray-900">
          School Management System
        </h1>
        <p class="text-gray-500 text-sm mt-1">
          Sign in to manage students, teachers, and academic records.
        </p>
      </div>

      <form
        id="login-form"
        class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8 space-y-5"
      >
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2"
            >Sign in as</label
          >
          <div class="grid grid-cols-3 gap-2" id="role-toggle">
            <button
              type="button"
              data-role="admin"
              class="role-btn border-2 border-red-700 bg-red-700 text-white rounded-lg py-2 text-sm font-medium transition"
            >
              Admin
            </button>
            <button
              type="button"
              data-role="teacher"
              class="role-btn border-2 border-gray-200 text-gray-600 rounded-lg py-2 text-sm font-medium transition hover:border-red-300"
            >
              Teacher
            </button>
            <button
              type="button"
              data-role="student"
              class="role-btn border-2 border-gray-200 text-gray-600 rounded-lg py-2 text-sm font-medium transition hover:border-red-300"
            >
              Student
            </button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Username</label
          >
          <input
            id="username"
            type="text"
            autocomplete="username"
            class="w-full border border-gray-300 focus:border-red-600 focus:ring-1 focus:ring-red-600 rounded-lg px-3 py-2.5 outline-none transition"
            placeholder="Username"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Password</label
          >
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            class="w-full border border-gray-300 focus:border-red-600 focus:ring-1 focus:ring-red-600 rounded-lg px-3 py-2.5 outline-none transition"
            placeholder="Password"
          />
        </div>

        <p
          id="error"
          class="hidden text-sm text-red-700 bg-red-50 border border-red-100 rounded-lg px-3 py-2"
        ></p>

        <button
          type="submit"
          class="w-full bg-red-700 hover:bg-red-800 text-white font-semibold rounded-lg py-2.5 transition"
        >
          Sign In
        </button>

        <div
          class="text-center text-xs text-gray-400 pt-2 border-t border-gray-100"
        >
          Demo accounts — admin / admin123 &nbsp;·&nbsp; mjohnson / teacher123
          &nbsp;·&nbsp; alice / student123
        </div>
      </form>
    </div>

    <script src="js/api.js"></script>
    <script>
      const roleButtons = document.querySelectorAll(".role-btn");
      roleButtons.forEach((btn) =>
        btn.addEventListener("click", () => {
          roleButtons.forEach((b) => {
            b.classList.remove("border-red-700", "bg-red-700", "text-white");
            b.classList.add("border-gray-200", "text-gray-600");
          });
          btn.classList.add("border-red-700", "bg-red-700", "text-white");
          btn.classList.remove("border-gray-200", "text-gray-600");
        }),
      );

      // If already logged in, skip straight to the dashboard.
      if (Auth.getToken()) window.location.href = "pages/dashboard.html";

      const form = document.getElementById("login-form");
      const errorBox = document.getElementById("error");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.classList.add("hidden");
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        if (!username || !password) {
          errorBox.textContent = "Please enter both a username and a password.";
          errorBox.classList.remove("hidden");
          form.classList.add("shake");
          setTimeout(() => form.classList.remove("shake"), 350);
          return;
        }
        try {
          const data = await Api.post(
            "/api/auth/login",
            { username, password },
            { auth: false },
          );
          Auth.setSession(data.token, data.user);
          window.location.href = "pages/dashboard.html";
        } catch (err) {
          errorBox.textContent =
            err.message || "Incorrect username or password.";
          errorBox.classList.remove("hidden");
          form.classList.add("shake");
          setTimeout(() => form.classList.remove("shake"), 350);
        }
      });
    </script>
  </body>
</html>
